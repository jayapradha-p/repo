Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is designed to verify the connectivity between Google SecOps
    and the Microsoft Azure Sentinel environment. It validates the integration's configuration
    by attempting to authenticate and perform a basic API call to ensure that the
    service is reachable and the credentials provided are correct.


    ### Parameters Description

    There are no specific input parameters for this action. It utilizes the global
    integration configuration parameters, including:

    * **Api Root**: The base URL for the Azure Sentinel API.

    * **OAUTH2 Login Endpoint Url**: The URL used for OAuth2 authentication.

    * **Client ID**: The application ID for authentication.

    * **Client Secret**: The application secret for authentication.

    * **Azure Active Directory ID**: The tenant ID.

    * **Azure Sentinel Workspace Name**: The specific workspace identifier.

    * **Azure Resource Group**: The resource group containing the workspace.

    * **Azure Subscription ID**: The subscription identifier.

    * **Verify SSL**: Boolean flag to enable/disable SSL verification.


    ### Flow Description

    1. **Initialization**: The action initializes the Siemplify environment and logs
    the start of the process.

    2. **Configuration Extraction**: It retrieves all necessary connection parameters
    from the integration settings.

    3. **Connectivity Test**: The action instantiates the `MicrosoftAzureSentinelManager`
    with the `force_check_connectivity` flag enabled. This triggers an internal process
    that:
        * Requests an OAuth2 token from the Microsoft login endpoint.
        * Executes a test GET request to the Sentinel incidents endpoint (limiting
    the result to one) to verify API access.
    4. **Status Reporting**: If the authentication and API call succeed, the action
    returns a success message. If an exception occurs (e.g., authentication failure
    or network timeout), the error is caught, logged, and the action is marked as
    failed.
