List Alert Rules:
  ai_description: >-
    ### General Description

    Retrieves a list of scheduled alert rules from Microsoft Azure Sentinel. This
    action allows users to filter rules based on their severity, type, tactics, and
    whether they are currently enabled. The results are presented in a structured
    data table and as a raw JSON object for further processing in the playbook.


    ### Parameters Description

    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Alert Rule Severity | String | No | Comma-separated list of severities (Informational,
    Low, Medium, High) to filter the rules. |

    | Fetch Specific Alert Rule Types | String | No | Comma-separated list of alert
    rule types to return (e.g., Scheduled). |

    | Fetch Specific Alert Rule Tactics | String | No | Comma-separated list of MITRE
    tactics to filter the rules. |

    | Fetch only Enabled Alert Rules | Boolean | No | If set to True, only rules that
    are currently enabled will be returned. |

    | Max rules to return | Integer | No | The maximum number of alert rules to include
    in the output. |


    ### Additional Notes

    This action does not run on specific entities and instead queries the global configuration
    of the Azure Sentinel workspace. If no filters are provided, the action will attempt
    to retrieve all available alert rules up to the specified limit.


    ### Flow Description

    1. **Authentication**: Connects to Azure Sentinel using the provided API Root,
    Client ID, Client Secret, and Tenant ID.

    2. **Data Retrieval**: Requests the list of alert rules from the configured Azure
    Sentinel workspace.

    3. **Filtering**: Applies client-side filtering based on the provided severity,
    rule type, and tactics parameters.

    4. **Status Check**: If 'Fetch only Enabled Alert Rules' is enabled, it excludes
    any rules that are currently disabled.

    5. **Limiting**: Truncates the list of rules to match the 'Max rules to return'
    parameter.

    6. **Output**: Returns the filtered list as a JSON object and populates a data
    table in the Google SecOps UI.
