Create Custom Hunting Rule:
  ai_description: >-
    ### General Description

    Creates a new custom hunting rule in Microsoft Azure Sentinel. This action allows
    security teams to programmatically define and deploy KQL-based hunting queries
    to their Sentinel workspace, facilitating proactive threat detection. The rule
    can be tagged with specific MITRE ATT&CK tactics and a detailed description for
    better categorization and context.


    ### Parameters Description

    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Display Name | String | Yes | The display name for the new custom hunting rule.
    |

    | Query | String | Yes | The KQL (Kusto Query Language) query that defines the
    hunting logic. |

    | Description | String | No | A detailed description of what the hunting rule
    is intended to detect. |

    | Tactics | String | No | A comma-separated list of MITRE ATT&CK tactics (e.g.,
    'InitialAccess, Persistence') to associate with the rule. |


    ### Flow Description

    1. **Parameter Extraction:** The action retrieves the necessary configuration
    (API credentials, workspace details) and action parameters (Display Name, Query,
    Description, Tactics).

    2. **Validation:** It validates the provided 'Tactics' against a list of supported
    Azure Sentinel tactics to ensure API compatibility.

    3. **Payload Construction:** A hunting rule request object is created, encapsulating
    the query, display name, and metadata (description and tactics) as tags.

    4. **External API Call:** The action performs a PUT request to the Azure Sentinel
    'savedSearches' endpoint to create the rule.

    5. **Result Processing:** Upon success, the details of the newly created hunting
    rule are returned as JSON and the action completes successfully.
