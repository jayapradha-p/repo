Add Comment to Incident:
  ai_description: >-
    Adds a comment to a specific Microsoft Azure Sentinel incident. This action allows
    users to append notes or updates directly to an incident within the Azure Sentinel
    platform by providing the incident's unique number and the desired comment text.


    ### Parameters

    | Parameter Name | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Incident Number | Integer | Yes | The unique identification number of the Azure
    Sentinel incident to which the comment will be added. |

    | Comment to Add | String | Yes | The text content of the comment to be appended
    to the incident. |


    ### Flow Description

    1. **Initialization**: The action initializes the Microsoft Azure Sentinel manager
    using the provided integration configuration (API Root, Client ID, Tenant ID,
    etc.).

    2. **Incident Retrieval**: It searches for the specific incident in Azure Sentinel
    using the provided `Incident Number`.

    3. **Comment Addition**: If the incident is successfully located, the action sends
    a request to the Azure Sentinel API to add the specified `Comment to Add` to that
    incident.

    4. **Result Reporting**: The action returns the details of the created comment
    in JSON format and provides a success message upon completion.
