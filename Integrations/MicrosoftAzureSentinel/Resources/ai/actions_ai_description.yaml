Update Incident Details:
  ai_description: >-
    Updates the details of a specific incident in Microsoft Azure Sentinel. This action
    allows for modifying various incident attributes such as title, status, severity,
    description, and ownership. It also supports closing incidents with specific reasons
    and comments. The action includes a built-in retry mechanism to handle potential
    API conflicts (HTTP 409) during the update process.


    ### Parameters Description


    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Incident Case Number | String | Yes | The specific Azure Sentinel incident number
    to be updated. |

    | Title | String | No | The new title to assign to the incident. |

    | Status | Enum | No | The new status for the incident (New, Active, Closed).
    If set to 'Not Updated', the status remains unchanged. |

    | Severity | Enum | No | The new severity level (Informational, Low, Medium, High).
    If set to 'Not Updated', the severity remains unchanged. |

    | Description | String | No | The new description text for the incident. |

    | Assigned To | String | No | The user principal name or email of the user to
    whom the incident should be assigned. |

    | Closed Reason | Enum | No | If the status is set to 'Closed', this specifies
    the reason (e.g., True Positive, False Positive). |

    | Closing Comment | String | No | An optional comment to include when closing
    the incident. |

    | Number of retries | Integer | No | The number of times to retry the update if
    a conflict error occurs. Default is 1. |

    | Retry Every | Integer | No | The wait time (in seconds) between retry attempts.
    Default is 20. |


    ### Additional Notes

    - If the 'Status' is changed from 'Closed' to another status, the classification
    and closing reasons are cleared in the external system.

    - The action performs a lookup to find the internal Azure Sentinel resource name
    associated with the provided 'Incident Case Number' before applying updates.


    ### Flow Description

    1. **Initialization**: Retrieves configuration parameters (API credentials, workspace
    details) and action parameters.

    2. **Validation**: Validates that the provided Severity, Status, and Closed Reason
    match the allowed values defined by the Microsoft Azure Sentinel API.

    3. **Incident Lookup**: Queries Azure Sentinel to find the unique resource identifier
    for the incident based on the provided 'Incident Case Number'.

    4. **Update Execution**: Constructs a payload with the new details and sends a
    PUT request to the Azure Sentinel API.

    5. **Conflict Handling**: If the API returns a 409 Conflict error, the action
    waits for the specified 'Retry Every' interval and attempts the update again,
    up to the 'Number of retries' limit.

    6. **Result Processing**: Returns the updated incident object as a JSON result
    and provides a success message.
