Create Alert Rule:
  ai_description: >-
    ### General Description

    Creates a new scheduled alert rule in Microsoft Azure Sentinel. This action allows
    security teams to programmatically define detection logic, severities, and query
    frequencies directly from Google SecOps. It supports full configuration of the
    rule, including KQL queries, trigger thresholds, and suppression settings.


    ### Parameters Description

    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Enable Alert Rule | Boolean | Yes | Specifies whether the new alert rule should
    be enabled immediately upon creation. |

    | Name | String | Yes | The display name for the new alert rule. |

    | Severity | Enum | Yes | The severity level assigned to the alert rule (Informational,
    Low, Medium, High). |

    | Query | String | Yes | The KQL (Kusto Query Language) query that the alert rule
    will execute. |

    | Frequency | String | Yes | How often the query should run, formatted as an ISO8601
    duration (e.g., PT1H for 1 hour). |

    | Period of Lookup Data | String | Yes | The time window of data the query will
    look back at, formatted as an ISO8601 duration. |

    | Trigger Operator | Enum | Yes | The operator used to compare the query results
    against the threshold (GreaterThan, LessThan, Equal, NotEqual). |

    | Trigger Threshold | Integer | Yes | The numeric value that triggers the alert
    based on the query results. |

    | Enable Suppression | Boolean | Yes | If true, stops the query from running for
    a specified duration after an alert is generated. |

    | Suppression Duration | String | Yes | The duration for which the query is suppressed,
    formatted as an ISO8601 duration. |

    | Description | String | No | A detailed description of the alert rule's purpose.
    |

    | Tactics | String | No | A comma-separated list of MITRE ATT&CK tactics associated
    with the rule. |


    ### Flow Description

    1. **Initialization**: The action retrieves configuration details for the Azure
    Sentinel environment and extracts all user-provided parameters.

    2. **Validation**: It validates that the provided tactics, severities, trigger
    operators, and ISO8601 durations (Frequency, Period, Suppression) conform to Azure
    Sentinel's requirements.

    3. **API Interaction**: The action generates a unique identifier (UUID) and sends
    a PUT request to the Azure Sentinel alert rules endpoint with the constructed
    rule properties.

    4. **Result Processing**: Upon successful creation, the action returns the full
    JSON representation of the new alert rule and marks the execution as completed.


    ### Additional Notes

    - Durations must follow the ISO8601 format (e.g., "PT5M" for 5 minutes, "P1D"
    for 1 day).

    - The minimum allowed duration is 5 minutes, and the maximum is 14 days.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new scheduled alert rule in the Microsoft Azure Sentinel workspace.
    fetches_data: false
    internal_data_mutation_explanation: null
