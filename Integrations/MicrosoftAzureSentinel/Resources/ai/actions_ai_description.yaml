    ### General Description

    The **Get Alert Rule Details** action retrieves comprehensive configuration information
    for a specific scheduled alert rule within Microsoft Azure Sentinel. This action
    is designed to provide visibility into the logic, frequency, and metadata of detection
    rules, which is essential for auditing and incident investigation.


    ### Parameters

