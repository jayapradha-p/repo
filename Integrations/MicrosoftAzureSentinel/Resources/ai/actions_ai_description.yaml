Get Incident Statistic:
  ai_description: >-
    ### General Description

    The **Get Incident Statistic** action retrieves aggregated statistics for incidents
    within a Microsoft Azure Sentinel workspace. It provides a high-level overview
    of incident distribution based on severity and status over a defined period, allowing
    analysts to monitor workload and threat trends.


    ### Parameters

    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Time Frame | Integer | No | Specifies the time window in hours (from the current
    time) for which to fetch incident statistics. If not provided, it defaults to
    3 hours. |


    ### Flow Description

    1. **Authentication**: The action establishes a connection to the Microsoft Azure
    Sentinel API using the configured credentials, including Client ID, Client Secret,
    Tenant ID, and Workspace details.

    2. **Time Window Calculation**: It calculates the start and end timestamps based
    on the current UTC time and the provided `Time Frame` parameter.

    3. **Data Retrieval**: The action sends a request to the Azure Sentinel aggregation
    endpoint to fetch incident counts grouped by severity (Critical, High, Medium,
    Low, Informational) and status (New, Active, Closed, etc.).

    4. **Output Generation**: The retrieved statistics are processed into a JSON result.
    Additionally, the action generates two data tables: "Microsoft Azure Sentinel
    Incident statistics by Severity" and "Microsoft Azure Sentinel Incident statistics
    by Status" for visual representation in the SOAR interface.


    ### Additional Notes

    This action does not operate on specific entities and is intended for global reporting
    or dashboarding purposes within a playbook. It is a read-only action that does
    not modify any data in Azure Sentinel.
