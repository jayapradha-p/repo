  ai_description: >-
    Updates the labels of a specific incident in Microsoft Azure Sentinel. This action
    allows users to append new labels to an existing incident identified by its case
    number. It operates asynchronously and includes a retry mechanism to handle potential
    API conflicts during the update process.


    ### Flow Description:

    1. **Parameter Extraction:** The action retrieves integration configuration (API
    credentials, workspace details) and action parameters (Incident Case Number, Labels,
    and Retry count).

    2. **Manager Initialization:** Initializes the `MicrosoftAzureSentinelManager`
    to handle communication with the Azure Sentinel API.

    3. **Incident Update:** Calls the `update_incident_labels` method, which first
    fetches the current incident to identify existing labels and then sends a `PUT`
    request to update the incident with the new appended labels.

    4. **Conflict Handling (Async):** If a `MicrosoftAzureSentinelConflictError` occurs
    (e.g., concurrent updates), the action increments a retry counter and sets the
    execution state to `INPROGRESS` for an asynchronous retry.

    5. **Result Processing:** Upon success, it provides a summary of which labels
    were added and which already existed, and attaches the full updated incident data
    as a JSON result.


    ### Parameters Description:

    | Parameter Name | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Incident Case Number | String | Yes | The specific Azure Sentinel incident number
    (e.g., '106') that needs to be updated. |

    | Labels | String | Yes | A comma-separated string of labels to be appended to
    the incident. |

    | Number of retries | Integer | No | The number of retry attempts the action should
    make if the incident update fails due to a conflict. Default is 1. |


    ### Additional Notes:

    - This action is asynchronous, meaning it can yield and resume if retries are
    necessary.

    - It does not replace existing labels; it only appends new ones that are not already
    present on the incident.
