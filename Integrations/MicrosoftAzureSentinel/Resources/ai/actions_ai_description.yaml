Update Alert Rule:
  ai_description: >-
    Updates an existing scheduled alert rule in Microsoft Azure Sentinel. This action
    allows for the modification of various rule properties including its status (enabled/disabled),
    display name, severity, KQL query, execution frequency, and lookback period. It
    also supports updating alert triggers, suppression settings, descriptions, and
    associated MITRE ATT&CK tactics.


    ### Parameters

    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Alert Rule ID | String | Yes | The unique identifier (GUID) of the alert rule
    to be updated. |

    | Enable Alert Rule | Boolean | No | Determines whether the alert rule should
    be enabled (True) or disabled (False). |

    | Name | String | No | The new display name for the alert rule. |

    | Severity | Enum | No | The severity level of the alert rule (Informational,
    Low, Medium, High). |

    | Query | String | No | The KQL query that the alert rule will execute. |

    | Frequency | String | No | How frequently the query runs (e.g., PT5M, PT1H).
    Minimum 5 minutes, maximum 14 days. |

    | Period of Lookup Data | String | No | The time window of data the query looks
    back at (e.g., PT1H, P1D). Minimum 5 minutes, maximum 14 days. |

    | Trigger Operator | Enum | No | The operator used to evaluate the trigger threshold
    (GreaterThan, LessThan, Equal, NotEqual). |

    | Trigger Threshold | Integer | No | The numerical threshold that triggers the
    alert. |

    | Enable Suppression | Boolean | No | Whether to stop running the query for a
    period after an alert is generated. |

    | Suppression Duration | String | No | How long to suppress the alert rule after
    a trigger (e.g., PT5H). Minimum 5 minutes, maximum 14 days. |

    | Description | String | No | A descriptive summary of the alert rule's purpose.
    |

    | Tactics | String | No | Comma-separated list of MITRE ATT&CK tactics associated
    with the rule. |


    ### Flow Description

    1. **Parameter Extraction and Validation**: The action retrieves configuration
    and action parameters. It validates that durations (Frequency, Period, Suppression)
    follow the ISO8601 format and fall within the allowed range (5m to 14d). It also
    validates tactics, severities, and trigger operators against allowed values.

    2. **Manager Initialization**: Initializes the Microsoft Azure Sentinel Manager
    using provided credentials and workspace details.

    3. **Rule Retrieval**: Fetches the current configuration of the specified alert
    rule from Azure Sentinel to ensure a base for the update.

    4. **Payload Construction**: Merges the provided update parameters with the existing
    rule data, ensuring read-only fields like `lastModifiedUtc` are handled correctly.

    5. **External Update**: Sends a PUT request to the Azure Sentinel API to update
    the alert rule configuration.

    6. **Result Processing**: Returns the updated alert rule details as a JSON result
    and completes the action.
