Run KQL Query:
  ai_description: >-
    ### General Description

    This action executes a Kusto Query Language (KQL) query against a Microsoft Azure
    Sentinel workspace. It is designed to retrieve log data and security events based
    on custom logic provided by the user. The action supports filtering by time span
    and limiting the number of returned records, making it a versatile tool for hunting,
    investigation, and data retrieval within the Sentinel environment.


    ### Parameters Description

    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | **KQL Query** | String | Yes | The KQL query string to execute in Azure Sentinel
    (e.g., `SecurityAlert`). |

    | **Time Span** | String | No | The time range for the query in ISO8601 duration
    format (e.g., `PT1H` for 1 hour, `P1D` for 1 day). |

    | **Query Timeout** | Integer | No | The timeout value (in seconds) for the Azure
    Sentinel API call. Default is 180. |

    | **Record Limit** | Integer | No | The maximum number of records to fetch. If
    provided, it appends a `| limit x` clause to the query. Default is 100. |


    ### Flow Description

    1.  **Initialization**: The action initializes the connection using configuration
    parameters such as Client ID, Client Secret, Tenant ID, and Workspace ID.

    2.  **Parameter Extraction**: It retrieves the KQL query, time span, timeout,
    and record limit from the action input.

    3.  **Validation**: The action validates the provided `Time Span` to ensure it
    follows the ISO8601 duration format.

    4.  **Execution**: The `MicrosoftAzureSentinelManager` sends a POST request to
    the Azure Sentinel query endpoint with the constructed KQL query and parameters.

    5.  **Output**: If results are returned, they are formatted into a JSON object
    and a data table named 'KQL Query results' which are then attached to the action
    output in Google SecOps.


    ### Additional Notes

    - If the `Record Limit` is set, the action automatically modifies the KQL query
    to include the limit clause unless it is already present.

    - The action result `is_success` will be `true` if the query executes without
    errors, even if no results are found.
