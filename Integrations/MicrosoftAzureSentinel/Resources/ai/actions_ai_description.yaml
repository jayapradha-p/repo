    ### General Description

    Deletes a specific custom hunting rule from Microsoft Azure Sentinel using its
    unique identifier. This action is used to manage and clean up hunting rules within
    the Azure Sentinel workspace directly from Google SecOps.


    ### Parameters Description

    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Hunting Rule ID | String | Yes | The unique identifier (GUID) of the custom
    hunting rule to be deleted from the Azure Sentinel workspace. |


    ### Flow Description

    1. **Initialization**: The action initializes the Siemplify environment and retrieves
    the necessary configuration parameters for Azure Sentinel (API Root, Client ID,
    Secret, Tenant ID, Workspace Name, etc.).

    2. **Parameter Extraction**: The action extracts the mandatory `Hunting Rule ID`
    provided by the user.

    3. **Manager Setup**: It initializes the `MicrosoftAzureSentinelManager` which
    handles authentication and communication with the Azure Sentinel API.

    4. **Execution**: The manager first verifies the existence of the rule and then
    sends a DELETE request to the Azure Sentinel endpoint associated with the provided
    Rule ID.

    5. **Completion**: The action returns a success message if the rule is deleted
    or an error message if the operation fails (e.g., rule not found or permission
    issues).


    ### Additional Notes

    - This action performs a permanent deletion in the external system (Azure Sentinel).

    - Ensure the provided `Hunting Rule ID` is correct, as this operation cannot be
    undone via this action.
