    1. **Authentication**: The action initializes a connection to the Microsoft Azure
    Sentinel API using the configured credentials (Client ID, Secret, Tenant ID, etc.).

    2. **Data Retrieval**: It executes a GET request to the Azure Sentinel workspace
    to fetch the specific alert rule details associated with the provided `Alert Rule
    ID`.

    3. **Data Processing**: The retrieved raw JSON data is parsed into a structured
    data model, extracting key attributes such as the query logic, severity, tactics,
    and suppression settings.

    4. **Output Generation**: The action populates the result JSON with the full rule
    configuration and generates a data table for the case wall, summarizing the rule's
    operational parameters.


    ### Additional Notes

