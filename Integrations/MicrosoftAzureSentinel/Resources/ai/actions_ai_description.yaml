List Incidents:
  ai_description: >-
    ### General Description

    The **List Incidents** action retrieves a list of incidents from Microsoft Azure
    Sentinel based on specific search criteria. It allows security analysts to query
    the external system for incidents within a defined time window, filtered by their
    current status and severity levels. The results are presented as a structured
    data table and a raw JSON output for further automation steps.


    ### Parameters Description

    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | **Time Frame** | Integer | No | The number of hours back from the current time
    to search for incidents. Defaults to 3 hours if not specified. |

    | **Status** | String | No | A comma-separated list of incident statuses to include
    (e.g., 'New, Active, Closed'). Defaults to all three. |

    | **Severity** | String | No | A comma-separated list of incident severities to
    include (e.g., 'Informational, Low, Medium, High'). Defaults to all four. |

    | **How Many Incidents to Fetch** | Integer | No | The maximum number of incident
    records to retrieve. Defaults to 200. |


    ### Flow Description

    1. **Initialization**: The action extracts integration configuration (API credentials,
    workspace details) and user-provided search parameters.

    2. **Validation**: It validates that the provided `Status` and `Severity` strings
    contain values recognized by the Microsoft Azure Sentinel API.

    3. **Query Construction**: A query is built using the `QueryBuilder` utility to
